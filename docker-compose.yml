services:
  backend:
    build: ./backend
    container_name: interntrack-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/instance:/app/instance
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: interntrack-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped